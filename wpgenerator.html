<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Business Display + Owner Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, 'Segoe UI', sans-serif; }
        body { margin: 0; min-height: 100vh; background-size: cover; background-attachment: fixed; }
        .site-header { background-size: cover; background-position: center; padding: 0.5rem 1rem; }
        .header-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; backdrop-filter: brightness(0.9); padding: 0.5rem 1rem; border-radius: 40px; }
        .business-name { font-size: 1.4rem; font-weight: bold; }
        .login-btn, .logout-btn { background: #0f172a; color: white; border: none; padding: 6px 12px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .nav-bar { 
            background: rgba(0,0,0,0.8); 
            backdrop-filter: blur(8px); 
            padding: 0.5rem 1rem; 
            display: flex; 
            gap: 1rem; 
            overflow-x: auto; 
            white-space: nowrap; 
            border-bottom: 2px solid #facc15; 
            position: relative; 
            z-index: 30; 
        }
        .dropdown { 
            position: relative; 
            display: inline-block; 
            z-index: 30; 
        }
        .dropbtn { 
            background: none; 
            border: none; 
            color: white; 
            font-weight: 600; 
            font-size: 1rem; 
            padding: 0.5rem 0.8rem; 
            cursor: pointer; 
        }
        .dropdown-content { 
            display: none; 
            position: absolute; 
            background: white; 
            min-width: 200px; 
            max-height: 300px; 
            overflow-y: auto; 
            z-index: 9999; 
            border-radius: 12px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.2); 
        }
        .dropdown-content a { 
            color: black; 
            padding: 8px 12px; 
            text-decoration: none; 
            display: block; 
            cursor: pointer; 
        }
        .dropdown-content a:hover { background: #f1f5f9; }
        .dropdown:hover .dropdown-content { display: block; }
        .main-container { max-width: 1200px; margin: 1rem auto; padding: 0 1rem; }
        .featured-section { margin-bottom: 1.5rem; position: relative; z-index: 10; }
        .featured-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 0.8rem; color: #1e293b; }
        .featured-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; overflow-x: auto; }
        .featured-card { background: white; border-radius: 16px; padding: 0.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; text-align: center; }
        .featured-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 12px; }
        .detail-area { background: white; border-radius: 28px; padding: 1.5rem; margin-top: 1rem; box-shadow: 0 8px 24px rgba(0,0,0,0.1); text-align: center; scroll-margin-top: 20px; }
        .detail-area img, .detail-area iframe { max-width: 100%; max-height: 400px; border-radius: 20px; margin: 0 auto; display: block; }
        .dashboard-panel { background: rgba(255,255,255,0.95); border-radius: 28px; padding: 1rem; margin-top: 1.5rem; display: none; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        input, textarea, select { width: 100%; padding: 8px 12px; border-radius: 20px; border: 1px solid #cbd5e1; }
        button { background: #facc15; border: none; padding: 8px 20px; border-radius: 30px; font-weight: bold; cursor: pointer; }
        footer { background: #1e293b; color: #cbd5e1; text-align: center; padding: 1rem; margin-top: 2rem; font-size: 0.8rem; }
        .loading { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; z-index: 2000; flex-direction: column; }
        .error-banner, .info-banner { background: #ef4444; color: white; padding: 0.5rem; text-align: center; border-radius: 20px; margin-bottom: 1rem; }
        .upload-area { margin-bottom: 1rem; border: 1px solid #facc15; border-radius: 20px; padding: 1rem; }
        @media (max-width: 900px) {
            .featured-grid { grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); }
            .form-row { grid-template-columns: 1fr; }
            .business-name { font-size: 1.2rem; }
            .header-content { flex-direction: column; align-items: stretch; }
            .login-btn, .logout-btn { align-self: flex-end; }
        }
        @media (max-width: 600px) {
            .featured-card img { height: 100px; }
            .detail-area img, .detail-area iframe { max-height: 250px; }
        }
    </style>
</head>
<body>
<div class="site-header" id="siteHeader">
    <div class="header-content">
        <div class="business-name" id="businessName">Loading...</div>
        <div>
            <button id="loginShowBtn" class="login-btn">Owner Login</button>
            <button id="logoutBtn" class="logout-btn" style="display:none;">Logout</button>
        </div>
    </div>
</div>
<nav class="nav-bar" id="navBar"></nav>
<div class="main-container">
    <div id="dataStatus" class="error-banner" style="display:none;"></div>
    <div id="loginError" class="error-banner" style="display:none;"></div>
    <div class="featured-section"><div class="featured-title">✨ Featured Items</div><div id="featuredGrid" class="featured-grid"></div></div>
    <div class="detail-area" id="detailArea"><h3 id="detailTitle">Select an item</h3><div id="detailContent"></div></div>
    <div id="dashboardPanel" class="dashboard-panel"><h2>📊 Owner Dashboard</h2><div id="dashboardInner"></div></div>
</div>
<footer id="siteFooter"></footer>
<div id="loginModal" style="display:none; position:fixed; top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;z-index:1000;"><div style="background:white; padding:1.5rem; border-radius:32px; width:280px;"><h3>Owner Login</h3><input type="text" id="loginUsername" placeholder="Username"><br><input type="password" id="loginPassword" placeholder="Password"><br><button id="loginSubmitBtn">Login</button><button id="loginCloseBtn">Cancel</button></div></div>

<script>
    let db = { businesses: [], categories: [], cards: [], images: [], videos: [] };
    let currentBusiness = null;
    let loggedInOwner = null;
    let randomInterval = null;
    let lastLoadTime = null;

    const CLOUD_NAME = "dpsc029n6";
    let UPLOAD_PRESET = localStorage.getItem('cloudinary_upload_preset') || '';
    let API_URL = localStorage.getItem('cloudflare_api_url') || '';

    // --- Cloudinary upload ---
    async function uploadToCloudinary(file) {
        if (!UPLOAD_PRESET) {
            alert('Upload preset not configured. Please set it in the Database Manager.');
            return null;
        }
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);
        try {
            const resp = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
            const data = await resp.json();
            if (data.secure_url) return { publicId: data.public_id, url: data.secure_url };
            else { alert('Upload failed: ' + (data.error?.message || 'Unknown')); return null; }
        } catch(err) { alert('Network error'); return null; }
    }

    // --- Load from Cloudflare Worker ---
    async function loadFromServer(showLoadingIndicator = true) {
        if (!API_URL) {
            document.getElementById('dataStatus').innerHTML = '⚠️ Cloudflare Worker URL not set. Please configure it in the Database Manager first.';
            document.getElementById('dataStatus').style.display = 'block';
            return;
        }
        if (showLoadingIndicator) showLoading(true);
        try {
            const resp = await fetch(API_URL);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            db = data.database || { businesses: [], categories: [], cards: [], images: [], videos: [] };
            lastLoadTime = new Date();
            document.getElementById('dataStatus').style.display = 'none';
        } catch(e) {
            console.error(e);
            document.getElementById('dataStatus').innerHTML = '⚠️ Failed to load from Cloudflare. Check your Worker URL and make sure the Worker is running.';
            document.getElementById('dataStatus').style.display = 'block';
            db = { businesses: [], categories: [], cards: [], images: [], videos: [] };
        }
        if (!db.businesses) db.businesses = [];
        if (!db.categories) db.categories = [];
        if (!db.cards) db.cards = [];
        if (!db.images) db.images = [];
        if (!db.videos) db.videos = [];

        const params = new URLSearchParams(window.location.search);
        const slug = params.get('urlslug');
        if (slug) currentBusiness = db.businesses.find(b => b.slug === slug && b.validCheck === true);
        if (!currentBusiness && db.businesses.length) currentBusiness = db.businesses.find(b => b.validCheck === true) || db.businesses[0];
        if (currentBusiness) {
            renderPublicView();
            const savedLogin = localStorage.getItem('loggedInBizId');
            if (savedLogin && savedLogin === currentBusiness.bizId) {
                loggedInOwner = currentBusiness;
                document.getElementById('loginShowBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'inline-block';
                renderDashboard();
            } else { 
                loggedInOwner = null; 
                document.getElementById('loginShowBtn').style.display = 'inline-block'; 
                document.getElementById('logoutBtn').style.display = 'none'; 
                document.getElementById('dashboardPanel').style.display = 'none'; 
            }
        } else {
            document.getElementById('businessName').innerText = 'Business not found or inactive';
            document.getElementById('loginShowBtn').style.display = 'inline-block';
            document.getElementById('logoutBtn').style.display = 'none';
        }
        if (showLoadingIndicator) showLoading(false);
    }

    function showLoading(show) {
        let loader = document.getElementById('globalLoader');
        if (!loader && show) { loader = document.createElement('div'); loader.id = 'globalLoader'; loader.className = 'loading'; loader.innerText = 'Loading...'; document.body.appendChild(loader); }
        else if (loader && !show) loader.remove();
    }

    // --- Public view rendering ---
    function renderPublicView() {
        if (!currentBusiness) return;
        document.getElementById('businessName').innerText = currentBusiness.bizName;
        if (currentBusiness.headerBgImage) document.getElementById('siteHeader').style.backgroundImage = `url(${currentBusiness.headerBgImage})`;
        if (currentBusiness.bodyBgImage) document.body.style.backgroundImage = `url(${currentBusiness.bodyBgImage})`;
        renderNavBar();
        renderFooter();
        startRandomFeatured();
    }

    function renderNavBar() {
        const bizCats = db.categories.filter(c => c.bizId === currentBusiness.bizId);
        const nav = document.getElementById('navBar');
        nav.innerHTML = '';
        bizCats.forEach(cat => {
            const dropdown = document.createElement('div'); dropdown.className = 'dropdown';
            const btn = document.createElement('button'); btn.className = 'dropbtn'; btn.innerText = cat.categoryName;
            btn.onclick = (e) => { e.preventDefault(); showCategoryItems(cat.categoryId); };
            const content = document.createElement('div'); content.className = 'dropdown-content';
            const items = db.cards.filter(c => c.bizId === currentBusiness.bizId && c.categoryId === cat.categoryId);
            items.slice(0, 10).forEach(item => {
                const a = document.createElement('a'); a.innerText = item.productName;
                a.onclick = (e) => { e.preventDefault(); showItemDetail(item); stopRandomFeatured(); };
                content.appendChild(a);
            });
            if (items.length > 10) { const more = document.createElement('a'); more.innerText = `... and ${items.length-10} more`; content.appendChild(more); }
            dropdown.appendChild(btn); dropdown.appendChild(content);
            nav.appendChild(dropdown);
        });
    }

    function showCategoryItems(categoryId) {
        stopRandomFeatured();
        const items = db.cards.filter(c => c.bizId === currentBusiness.bizId && c.categoryId === categoryId);
        const grid = document.getElementById('featuredGrid');
        if (items.length === 0) { grid.innerHTML = '<p>No items in this category.</p>'; return; }
        grid.innerHTML = '';
        items.slice(0,4).forEach(card => {
            const img = db.images.find(i => i.imageId === card.imageId && i.bizId === currentBusiness.bizId);
            const imgUrl = img ? img.imageData : 'https://via.placeholder.com/300x200?text=No+Image';
            const div = document.createElement('div'); div.className = 'featured-card';
            div.onclick = () => showItemDetail(card);
            div.innerHTML = `<img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/300x200'"><h4>${escapeHtml(card.productName)}</h4><p>${escapeHtml(card.price)}</p>`;
            grid.appendChild(div);
        });
        for (let i = items.length; i < 4; i++) {
            const empty = document.createElement('div'); empty.className = 'featured-card'; empty.style.opacity = '0.5'; empty.innerHTML = '<div style="height:120px; background:#e2e8f0; border-radius:12px;"></div><p> </p>'; grid.appendChild(empty);
        }
    }

    function startRandomFeatured() {
        if (randomInterval) clearInterval(randomInterval);
        updateRandomFeatured();
        randomInterval = setInterval(updateRandomFeatured, 8000);
    }
    function stopRandomFeatured() { if (randomInterval) { clearInterval(randomInterval); randomInterval = null; } }

    function updateRandomFeatured() {
        const allCards = db.cards.filter(c => c.bizId === currentBusiness.bizId && c.defaultDisplay === true);
        if (allCards.length === 0) { document.getElementById('featuredGrid').innerHTML = '<p>No featured items.</p>'; return; }
        const shuffled = [...allCards];
        for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i+1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
        const selected = shuffled.slice(0,4);
        const grid = document.getElementById('featuredGrid');
        grid.innerHTML = '';
        selected.forEach(card => {
            const img = db.images.find(i => i.imageId === card.imageId && i.bizId === currentBusiness.bizId);
            const imgUrl = img ? img.imageData : 'https://via.placeholder.com/300x200?text=No+Image';
            const div = document.createElement('div'); div.className = 'featured-card';
            div.onclick = () => { showItemDetail(card); stopRandomFeatured(); };
            div.innerHTML = `<img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/300x200'"><h4>${escapeHtml(card.productName)}</h4><p>${escapeHtml(card.price)}</p>`;
            grid.appendChild(div);
        });
        for (let i = selected.length; i < 4; i++) {
            const empty = document.createElement('div'); empty.className = 'featured-card'; empty.style.opacity = '0.5'; empty.innerHTML = '<div style="height:120px; background:#e2e8f0; border-radius:12px;"></div><p> </p>'; grid.appendChild(empty);
        }
    }

    function showItemDetail(card) {
        stopRandomFeatured();
        const img = db.images.find(i => i.imageId === card.imageId && i.bizId === currentBusiness.bizId);
        const vid = db.videos.find(v => v.videoId === card.videoId && v.bizId === currentBusiness.bizId);
        let media = '';
        if (vid && vid.videoData) media = `<iframe width="100%" height="315" src="https://www.youtube.com/embed/${extractYouTubeId(vid.videoData)}" frameborder="0" allowfullscreen></iframe>`;
        else if (img && img.imageData) media = `<img src="${img.imageData}" style="max-width:100%; max-height:400px; border-radius:20px;">`;
        document.getElementById('detailTitle').innerHTML = card.productName;
        document.getElementById('detailContent').innerHTML = `${media}<p><strong>Description:</strong> ${escapeHtml(card.description)}</p><p><strong>Price:</strong> ${escapeHtml(card.price)}</p><button onclick="alert('Order feature coming soon')">Order Now</button>`;
        document.getElementById('detailArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderFooter() {
        const footer = document.getElementById('siteFooter');
        footer.innerHTML = `<div>📍 ${escapeHtml(currentBusiness.address || '')} &nbsp;|&nbsp; 📞 ${escapeHtml(currentBusiness.phone || '')} &nbsp;|&nbsp; ✉️ ${escapeHtml(currentBusiness.email || '')}</div>
                           <div>© ${new Date().getFullYear()} Community Business Services</div>
                           ${currentBusiness.mapImage ? `<img src="${escapeHtml(currentBusiness.mapImage)}" alt="Map" style="max-width:200px; margin:10px;">` : ''}
                           ${currentBusiness.qrImage ? `<img src="${escapeHtml(currentBusiness.qrImage)}" alt="QR" style="max-width:100px;">` : ''}`;
    }

    // --- Owner Dashboard ---
    function renderDashboard() {
        if (!loggedInOwner) return;
        const panel = document.getElementById('dashboardPanel');
        panel.style.display = 'block';
        const inner = document.getElementById('dashboardInner');
        inner.innerHTML = `
            <div class="upload-area">
                <h3>📸 Upload Image to Cloudinary</h3>
                <input type="file" id="imageUploadInput" accept="image/*" capture="environment">
                <input type="text" id="imageNameInput" placeholder="Image name">
                <button id="uploadImageBtn">Upload & Add to Images</button>
                <div id="uploadResult"></div>
            </div>
            <div class="form-row"><div><label>Business Name</label><input id="dashBizName" value="${escapeHtml(loggedInOwner.bizName)}"></div>
            <div><label>Slug (not editable)</label><input id="dashSlug" value="${escapeHtml(loggedInOwner.slug)}" disabled></div>
            <div><label>Phone</label><input id="dashPhone" value="${escapeHtml(loggedInOwner.phone)}"></div>
            <div><label>Email</label><input id="dashEmail" value="${escapeHtml(loggedInOwner.email)}"></div>
            <div><label>Address</label><input id="dashAddress" value="${escapeHtml(loggedInOwner.address)}"></div>
            <div><label>Owner First</label><input id="dashOwnerFirst" value="${escapeHtml(loggedInOwner.ownerFirst)}"></div>
            <div><label>Owner Last</label><input id="dashOwnerLast" value="${escapeHtml(loggedInOwner.ownerLast)}"></div>
            <div><label>Owner Phone</label><input id="dashOwnerPhone" value="${escapeHtml(loggedInOwner.ownerPhone)}"></div>
            <div><label>Username</label><input id="dashUsername" value="${escapeHtml(loggedInOwner.username)}"></div>
            <div><label>Password</label><input id="dashPassword" value="${escapeHtml(loggedInOwner.password)}"></div>
            <div><label>Payment Methods</label><input id="dashPayment" value="${escapeHtml(loggedInOwner.paymentMethod)}"></div>
            <div><label>Header Background URL</label><input id="dashHeaderBg" value="${escapeHtml(loggedInOwner.headerBgImage)}"></div>
            <div><label>Body Background URL</label><input id="dashBodyBg" value="${escapeHtml(loggedInOwner.bodyBgImage)}"></div>
            <div><label>Map Image URL</label><input id="dashMapImg" value="${escapeHtml(loggedInOwner.mapImage)}"></div>
            <div><label>QR Image URL</label><input id="dashQrImg" value="${escapeHtml(loggedInOwner.qrImage)}"></div></div>
            <hr><h3>Categories</h3><div id="dashCatList"></div><hr><h3>Cards</h3><div id="dashCardList"></div>
            <button id="saveChangesToTemp" style="margin-top: 1rem;">💾 Save Changes to temporary.json & Email Master</button>
        `;
        renderDashboardCategories();
        renderDashboardCards();

        document.getElementById('uploadImageBtn').onclick = async () => {
            const fileInput = document.getElementById('imageUploadInput');
            const nameInput = document.getElementById('imageNameInput');
            if (!fileInput.files.length || !nameInput.value.trim()) { alert('Select an image and enter a name.'); return; }
            const result = await uploadToCloudinary(fileInput.files[0]);
            if (result) {
                const newId = generateId('img');
                db.images.push({ imageId: newId, bizId: currentBusiness.bizId, imageName: nameInput.value.trim(), cloudinaryPublicId: result.publicId, imageData: result.url });
                saveDBandRefresh();
                fileInput.value = ''; nameInput.value = '';
                document.getElementById('uploadResult').innerHTML = `<span style="color:green;">✅ Image uploaded.</span>`;
                setTimeout(() => document.getElementById('uploadResult').innerHTML = '', 3000);
            }
        };

        document.getElementById('saveChangesToTemp').onclick = () => {
            const updatedBiz = { ...loggedInOwner,
                bizName: document.getElementById('dashBizName').value,
                phone: formatPhone(document.getElementById('dashPhone').value),
                email: document.getElementById('dashEmail').value,
                address: document.getElementById('dashAddress').value,
                ownerFirst: document.getElementById('dashOwnerFirst').value,
                ownerLast: document.getElementById('dashOwnerLast').value,
                ownerPhone: formatPhone(document.getElementById('dashOwnerPhone').value),
                username: document.getElementById('dashUsername').value,
                password: document.getElementById('dashPassword').value,
                paymentMethod: document.getElementById('dashPayment').value,
                headerBgImage: document.getElementById('dashHeaderBg').value,
                bodyBgImage: document.getElementById('dashBodyBg').value,
                mapImage: document.getElementById('dashMapImg').value,
                qrImage: document.getElementById('dashQrImg').value
            };
            const tempData = { business: updatedBiz, categories: db.categories.filter(c => c.bizId === currentBusiness.bizId), cards: db.cards.filter(c => c.bizId === currentBusiness.bizId), images: db.images.filter(i => i.bizId === currentBusiness.bizId), videos: db.videos.filter(v => v.bizId === currentBusiness.bizId) };
            
            const dataStr = JSON.stringify(tempData, null, 2);
            const blob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'temporary.json';
            a.click();
            URL.revokeObjectURL(url);
            
            const mailtoLink = `mailto:info@communitybusinessservices.ca?subject=Business Update Request - ${updatedBiz.bizName}&body=Please find the attached temporary.json file for review and approval.`;
            window.open(mailtoLink, '_blank');
            alert('temporary.json downloaded. An email draft has been opened for the website master.');
        };
    }

    function renderDashboardCategories() {
        const container = document.getElementById('dashCatList');
        const bizCats = db.categories.filter(c => c.bizId === currentBusiness.bizId);
        container.innerHTML = '<div><input id="newCatNameDash" placeholder="New category"><button id="addCatDashBtn">Add</button></div>';
        bizCats.forEach(cat => {
            const div = document.createElement('div');
            div.innerHTML = `<input type="text" class="dashCatName" data-id="${cat.categoryId}" value="${escapeHtml(cat.categoryName)}"> <button class="dashDelCat" data-id="${cat.categoryId}">Delete</button>`;
            container.appendChild(div);
        });
        document.querySelectorAll('.dashCatName').forEach(inp => inp.onchange = () => {
            const cat = db.categories.find(c => c.categoryId === inp.getAttribute('data-id'));
            if (cat) cat.categoryName = inp.value;
            saveDBandRefresh();
        });
        document.querySelectorAll('.dashDelCat').forEach(btn => btn.onclick = () => {
            const catId = btn.getAttribute('data-id');
            if (confirm('Delete category and all its cards?')) {
                db.categories = db.categories.filter(c => c.categoryId !== catId);
                db.cards = db.cards.filter(c => c.categoryId !== catId);
                saveDBandRefresh();
            }
        });
        document.getElementById('addCatDashBtn').onclick = () => {
            const name = document.getElementById('newCatNameDash').value.trim();
            if (name) {
                db.categories.push({ categoryId: generateId('cat'), bizId: currentBusiness.bizId, categoryName: name });
                saveDBandRefresh();
            }
        };
    }

    function renderDashboardCards() {
        const container = document.getElementById('dashCardList');
        const bizCards = db.cards.filter(c => c.bizId === currentBusiness.bizId);
        const cats = db.categories.filter(c => c.bizId === currentBusiness.bizId);
        const bizImages = db.images.filter(i => i.bizId === currentBusiness.bizId);
        container.innerHTML = `<div><select id="newCardCat">${cats.map(c=>`<option value="${c.categoryId}">${c.categoryName}</option>`).join('')}</select>
                               <input id="newCardName" placeholder="Name">
                               <input id="newCardPrice" placeholder="Price">
                               <select id="newCardImageSelect"><option value="">No Image</option>${bizImages.map(img=>`<option value="${img.imageId}">${img.imageName}</option>`).join('')}</select>
                               <select id="newCardVideoSelect"><option value="">No Video</option>${db.videos.filter(v=>v.bizId===currentBusiness.bizId).map(v=>`<option value="${v.videoId}">${v.videoName}</option>`).join('')}</select>
                               <label><input type="checkbox" id="newCardDefault"> Featured</label>
                               <button id="addCardDashBtn">Add Card</button></div>`;
        bizCards.forEach(card => {
            const div = document.createElement('div');
            div.innerHTML = `<strong>${escapeHtml(card.productName)}</strong> (${cats.find(c=>c.categoryId===card.categoryId)?.categoryName}) - ${escapeHtml(card.price)} <button class="dashEditCard" data-id="${card.cardId}">Edit</button> <button class="dashDelCard" data-id="${card.cardId}">Delete</button>`;
            container.appendChild(div);
        });
        document.querySelectorAll('.dashEditCard').forEach(btn => btn.onclick = () => {
            const card = db.cards.find(c => c.cardId === btn.getAttribute('data-id'));
            if (card) {
                const newName = prompt('Product name', card.productName); if (newName) card.productName = newName;
                const newDesc = prompt('Description', card.description); if (newDesc !== null) card.description = newDesc;
                const newPrice = prompt('Price', card.price); if (newPrice !== null) card.price = newPrice;
                saveDBandRefresh();
            }
        });
        document.querySelectorAll('.dashDelCard').forEach(btn => btn.onclick = () => {
            if (confirm('Delete this card?')) {
                db.cards = db.cards.filter(c => c.cardId !== btn.getAttribute('data-id'));
                saveDBandRefresh();
            }
        });
        document.getElementById('addCardDashBtn').onclick = () => {
            const catId = document.getElementById('newCardCat').value;
            const name = document.getElementById('newCardName').value.trim();
            if (!name) return;
            db.cards.push({ cardId: generateId('card'), bizId: currentBusiness.bizId, categoryId: catId, productName: name, description: '', price: document.getElementById('newCardPrice').value, imageId: document.getElementById('newCardImageSelect').value, videoId: document.getElementById('newCardVideoSelect').value, defaultDisplay: document.getElementById('newCardDefault').checked });
            saveDBandRefresh();
            document.getElementById('newCardName').value = '';
            document.getElementById('newCardPrice').value = '';
            document.getElementById('newCardDefault').checked = false;
        };
    }

    function saveDBandRefresh() {
        // Save changes to localStorage for the dashboard session (not pushing to Cloudflare)
        localStorage.setItem('multiBusinessDB', JSON.stringify(db));
        currentBusiness = db.businesses.find(b => b.bizId === currentBusiness.bizId);
        if (loggedInOwner) loggedInOwner = currentBusiness;
        renderPublicView();
        if (loggedInOwner) renderDashboard();
        else document.getElementById('dashboardPanel').style.display = 'none';
    }

    // --- Login / Logout ---
    function showLoginModal() { document.getElementById('loginError').style.display = 'none'; document.getElementById('loginModal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }
    function attemptLogin() {
        const user = document.getElementById('loginUsername').value.trim();
        const pwd = document.getElementById('loginPassword').value.trim();
        const errorDiv = document.getElementById('loginError');
        if (!currentBusiness) { errorDiv.innerText = 'No active business found.'; errorDiv.style.display = 'block'; return; }
        if (currentBusiness.username === user && currentBusiness.password === pwd && currentBusiness.validCheck === true) {
            loggedInOwner = currentBusiness;
            localStorage.setItem('loggedInBizId', currentBusiness.bizId);
            closeLoginModal();
            renderDashboard();
            document.getElementById('loginShowBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            errorDiv.style.display = 'none';
        } else {
            errorDiv.innerText = `Invalid credentials for ${currentBusiness.bizName}. Expected username: "${currentBusiness.username}"`;
            errorDiv.style.display = 'block';
        }
    }
    function logout() {
        loggedInOwner = null;
        localStorage.removeItem('loggedInBizId');
        document.getElementById('loginShowBtn').style.display = 'inline-block';
        document.getElementById('logoutBtn').style.display = 'none';
        document.getElementById('dashboardPanel').style.display = 'none';
        renderPublicView();
        startRandomFeatured();
    }

    // --- Helper functions ---
    function formatPhone(input) { let d = input.replace(/\D/g,''); if(d.length===10) return d.slice(0,3)+' '+d.slice(3,6)+' '+d.slice(6); if(d.length===7) return d.slice(0,3)+' '+d.slice(3); return input; }
    function generateId(prefix) { return prefix+'_'+Date.now()+'_'+Math.random().toString(36).substring(2,8); }
    function extractYouTubeId(url) { const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/); return match ? match[1] : ''; }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

    // --- Event listeners ---
    document.getElementById('loginShowBtn')?.addEventListener('click', showLoginModal);
    document.getElementById('logoutBtn')?.addEventListener('click', logout);
    document.getElementById('loginSubmitBtn')?.addEventListener('click', attemptLogin);
    document.getElementById('loginCloseBtn')?.addEventListener('click', closeLoginModal);
    loadFromServer(true);
</script>
</body>
</html>
